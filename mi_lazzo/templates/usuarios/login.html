{% extends 'usuarios/base.html' %}
{% load static %}

{% block content %}
<div class="card">
    <div class="logo-container">
        <h1 class="app-title">LAZZO</h1>
        <p style="color: #666; margin-top: 10px;">Inicia sesión en tu cuenta</p>
    </div>

    <h2 style="font-size: 1.5rem;">Iniciar Sesión</h2>

    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="username">Nombre de usuario</label>
            <input type="text" 
                   id="username" 
                   name="username" 
                   placeholder="Ingresa tu usuario" 
                   required>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" 
                   id="password" 
                   name="password" 
                   placeholder="Ingresa tu contraseña" 
                   required>
        </div>

        <button type="submit" class="btn btn-primary">
            Iniciar Sesión
        </button>
    </form>

    <div class="divider">
        <span>¿No tienes cuenta?</span>
    </div>

    <a href="{% url 'seleccion_tipo' %}" class="btn btn-outline">
        Registrarse
    </a>

    <div style="text-align: center; margin-top: 20px;">
        <a href="{% url 'inicio' %}" class="link-secondary">← Volver al inicio</a>
    </div>
</div>
{% endblock %}
